<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat - Like ChatGPT</title>
<style>
/* === CSS UTAMA === */
:root{ --bg:#212121; --side:#171717; --bubble-ai:#2f2f2f; --bubble-user:#444; --border:#3a3a3a; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:#fff;display:flex;height:100dvh;overflow:hidden}

/* Sidebar */
#sidebar{width:260px;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--border)}
#sideTop{padding:12px}
#newBtn{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:#fff;cursor:pointer}
#chatList{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.chatItem{padding:10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatItem:hover,.chatItem.active{background:#2f2f2f}

/* Main */
#main{flex:1;display:flex;flex-direction:column;position:relative}
#topbar{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#chatBox{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;max-width:800px;width:100%;margin:0 auto}
.bubble{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.5;word-wrap:break-word}
.bubble.user{align-self:flex-end;background:var(--bubble-user);border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--bubble-ai);border-bottom-left-radius:4px}
.bubble img{max-width:220px;border-radius:10px;margin-bottom:8px;display:block}

/* Input Area */
#inputArea{padding:16px;max-width:800px;width:100%;margin:0 auto}
#inputWrap{background:#2f2f2f;border-radius:24px;display:flex;align-items:center;padding:6px 12px;gap:8px}
#msgInp{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:10px;font-size:15px}
.iconBtn{background:transparent;border:none;color:#aaa;font-size:20px;cursor:pointer}
#sendBtn{background:#fff;color:#000;width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-weight:bold}
#preview{display:none;padding:8px 16px;background:#2f2f2f;margin-bottom:10px;border-radius:12px;font-size:13px}

/* Mobile */
@media(max-width:700px){#sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:99;transition:0.3s}#sidebar.open{left:0}}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sideTop"><button id="newBtn" onclick="newChat()">+ New Chat</button></div>
  <div id="chatList"></div>
  <div style="padding:10px;border-top:1px solid var(--border);display:flex;gap:8px">
    <button class="iconBtn" onclick="openM('loginM')">👤</button>
    <button class="iconBtn" onclick="openM('apiM')">⚙️</button>
    <button class="iconBtn" onclick="exportChat()" style="margin-left:auto">⬇️</button>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <button class="iconBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <b>AI Chat</b><span></span>
  </div>
  <div id="chatBox"></div>
  <div id="inputArea">
    <div id="preview"></div>
    <div id="inputWrap">
      <label class="iconBtn" style="cursor:pointer">📎<input type="file" id="fileInp" hidden accept="image/*"></label>
      <input id="msgInp" placeholder="Message AI..." onkeydown="if(event.key==='Enter') send()">
      <button id="sendBtn" onclick="send()">↑</button>
    </div>
  </div>
</div>

<!-- Modals -->
<div id="loginM" style="display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:100"><div style="background:#2f2f2f;padding:20px;border-radius:12px;display:flex;gap:8px"><input id="uInp" placeholder="Username"><button onclick="login()">OK</button></div></div>
<div id="apiM" style="display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:100"><div style="background:#2f2f2f;padding:20px;border-radius:12px;display:flex;flex-direction:column;gap:8px"><input id="kInp" placeholder="Gemini API Key" style="width:300px"><button onclick="saveKey()">Save</button></div></div>

<script>
// === JS UTAMA ===
let user=localStorage.getItem('ai_user');
let keys=JSON.parse(localStorage.getItem('gemini_keys')||'[]');
let allChats=JSON.parse(localStorage.getItem('all_chats')||'{}');
let cur=localStorage.getItem('cur_chat')||Date.now().toString();
let pend=null;

const $ = id=>document.getElementById(id);
function openM(id){$(id).style.display='flex'}
function closeM(id){$(id).style.display='none'}
function login(){user=$('uInp').value; localStorage.setItem('ai_user',user); closeM('loginM')}
function saveKey(){keys=[$('kInp').value.trim()]; localStorage.setItem('gemini_keys',JSON.stringify(keys)); closeM('apiM')}

function newChat(){cur=Date.now().toString(); allChats[cur]=[]; save(); renderList(); load()}
function save(){localStorage.setItem('all_chats',JSON.stringify(allChats)); localStorage.setItem('cur_chat',cur)}

function renderList(){
  const list=$('chatList'); list.innerHTML='';
  Object.keys(allChats).reverse().forEach(id=>{
    const d=document.createElement('div'); d.className='chatItem'+(id==cur?' active':'');
    d.textContent=(allChats[id][0]?.text||'New Chat').slice(0,30);
    d.onclick=()=>{cur=id; save(); renderList(); load(); document.getElementById('sidebar').classList.remove('open')};
    list.appendChild(d);
  })
}

function load(){
  const box=$('chatBox'); box.innerHTML='';
  (allChats[cur]||[]).forEach(m=>{
    const div=document.createElement('div'); div.className='bubble '+m.role;
    let html='';
    if(m.image) html+=`<img src="${m.image}">`;
    html+= (m.text||'').replace(/\n/g,'<br>');
    div.innerHTML=html; box.appendChild(div);
  });
  box.scrollTop=box.scrollHeight;
}

// Upload file
$('fileInp').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    pend={name:f.name,mime:f.type,data:ev.target.result,isImage:true};
    const p=$('preview'); p.style.display='block';
    p.innerHTML=`📎 ${f.name} <span onclick="clearF()" style="cursor:pointer;margin-left:10px">✕</span>`;
  };
  r.readAsDataURL(f);
}
function clearF(){pend=null; $('preview').style.display='none'; $('fileInp').value='';}

// Fungsi SEND yang bener (bisa kirim gambar)
async function send(){
  const txt=$('msgInp').value.trim();
  if(!txt &&!pend) return;
  if(!user){openM('loginM'); return}
  if(keys.length==0){openM('apiM'); return}
  if(!allChats[cur]) allChats[cur]=[];

  const um={role:'user', text: txt || ''};
  if(pend) { um.text += (txt?'':'') + `\n📎 ${pend.name}`; um.image=pend.data; }
  allChats[cur].push(um);
  $('msgInp').value=''; const fs=pend; clearF();
  load(); save(); renderList();

  try{
    let parts=[]; if(txt) parts.push({text:txt});
    if(fs){
      const b64=fs.data.split(',')[1];
      parts.push({inlineData:{mimeType:fs.mime,data:b64}});
      if(!txt) parts.unshift({text:"Jelaskan gambar ini"});
    }
    if(parts.length==0) return;
    const model=localStorage.getItem('gemini_model')||'gemini-2.0-flash';
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${keys[0]}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts}]})
    });
    const data=await res.json();
    const rep=data.candidates?.[0]?.content?.parts?.[0]?.text || `Error: ${data.error?.message||'gagal'}`;
    allChats[cur].push({role:'ai', text: rep});
    save(); load();
  }catch(e){
    allChats[cur].push({role:'ai', text:'Error: '+e.message}); save(); load();
  }
}

function exportChat(){
  const txt=(allChats[cur]||[]).map(m=>`${m.role}: ${m.text}`).join('\n\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt])); a.download='chat.txt'; a.click();
}

renderList(); load();
</script>
</body>
</html>
