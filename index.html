<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat - Akun</title><style>
:root{--bg:#212121;--side:#171717;--bdr:#3a3a3a;--box:#2f2f2f}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:var(--bg);color:#fff;display:flex;height:100dvh;overflow:hidden}
#sidebar{width:260px;background:var(--side);border-right:1px solid var(--bdr);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
#chatBox{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:800px;width:100%;margin:0 auto}
.bubble{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.5}
.user{align-self:flex-end;background:#444}.ai{align-self:flex-start;background:var(--box)}
.bubble img{max-width:200px;border-radius:10px;display:block;margin-bottom:6px}
#inputWrap{background:var(--box);border-radius:24px;display:flex;align-items:center;padding:6px 12px;gap:8px;max-width:800px;width:100%;margin:0 auto 16px}
#msgInp{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:10px}
.icon{cursor:pointer;background:none;border:none;color:#aaa;font-size:20px}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:99}
.card{background:var(--box);padding:20px;border-radius:12px;width:320px;display:flex;flex-direction:column;gap:10px}
.card input{padding:10px;border-radius:8px;border:1px solid var(--bdr);background:#1a1a1a;color:#fff}
.card button{padding:10px;border-radius:8px;border:none;background:#fff;color:#000;cursor:pointer;font-weight:bold}
.chatItem{padding:10px;border-radius:8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatItem:hover{background:var(--box)}.active{background:var(--box)}
@media(max-width:700px){#sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:.3s}#sidebar.open{left:0}}
</style></head><body>

<div id="sidebar">
  <div id="sideTop"><b>AI Chat</b><span id="closeSide" style="display:none;cursor:pointer">✕</span></div>
  <div id="userBox" style="display:none;margin:8px 0;padding:10px;background:#2a2a2a;border-radius:10px;font-size:13px"><span id="uEmail"></span></div>
  <div id="chatList"></div>
  <div class="sideBottom">
    <button id="btnNew">+ Chat Baru</button>
    <div style="display:flex;gap:8px">
      <button id="btnLogin" style="flex:1">Login</button>
      <button id="btnLogout" style="flex:1;display:none">Logout</button>
      <button id="btnApi">⚙️</button>
      <button id="openSide" style="display:none">☰</button>
    </div>
  </div>
</div>

<div id="main">
<div style="padding:12px;border-bottom:1px solid var(--bdr);display:flex;gap:10px"><button class="icon" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><b id="title">AI Chat</b></div>
<div id="chatBox"></div>
<div style="padding:12px">
<div id="preview" style="display:none;background:var(--box);padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:13px"></div>
<div id="inputWrap"><label class="icon">📎<input type="file" id="fileInp" hidden accept="image/*"></label><input id="msgInp" placeholder="Message..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()" style="background:#fff;color:#000;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer">↑</button></div>
</div>
</div>

<!-- LOGIN -->

<div id="loginModal" class="modal"><div class="box">
  <h3>Login Privat</h3><p style="font-size:12px;color:#aaa">Riwayat akan disimpan per email, jadi privat.</p>
  <input id="loginName" placeholder="Nama (opsional)"><input id="loginEmail" placeholder="Email kamu">
  <button id="doLogin" style="padding:11px;border:none;border-radius:10px;background:#fff;color:#000;font-weight:700">Masuk</button>
  <button onclick="document.getElementById('loginModal').classList.remove('on')" style="background:none;border:none;color:#888">Batal</button>
</div></div>
<h3>Login / Daftar</h3>
<input id="uInp" placeholder="Username">
<input id="pInp" type="password" placeholder="Password">
<button onclick="doLogin()">Masuk</button>
<div style="font-size:12px;opacity:.6">Akun baru otomatis dibuat kalau username belum ada. Chat tersimpan per akun.</div>
</div></div>

<div id="apiM" class="modal"><div class="card"><h3>API Key Gemini</h3><input id="kInp" placeholder="Paste API Key"><button onclick="saveKey()">Simpan</button><button onclick="closeM('apiM')" style="background:transparent;color:#fff;border:1px solid var(--bdr)">Tutup</button></div></div>

<script>
let curUser = localStorage.getItem('ai_cur_user');
let users = JSON.parse(localStorage.getItem('ai_users')||'{}'); // {username:{pass, chats:{}, curId}}
let keys = JSON.parse(localStorage.getItem('gemini_keys')||'[]');
let pend=null;

const $=id=>document.getElementById(id);
  // FIX TOMBOL LOGIN HP
document.addEventListener('DOMContentLoaded', ()=>{
  const btn = document.getElementById('loginBtn');
  if(btn){
    btn.addEventListener('click', doLogin);
    btn.addEventListener('touchend', (e)=>{ e.preventDefault(); doLogin(); });
  }
});
function openM(id){$(id).style.display='flex'} function closeM(id){$(id).style.display='none'}

// ===LOGIN SYSTEM===
function checkLogin(){
 if(!curUser){ openM('loginM'); $('userInfo').textContent='Belum login'; return false}
 else{ closeM('loginM'); $('userInfo').textContent='👤 '+curUser; $('title').textContent='Hi, '+curUser; renderList(); load(); return true}
}
function doLogin(){
 let u=$('uInp').value.trim(); let p=$('pInp').value.trim();
 if(!u||!p) return alert('Isi username & password');
 if(!users[u]){ // daftar baru
   users[u]={pass:p, chats:{}, curId:Date.now().toString()}; users[u].chats[users[u].curId]=[];
 }else{ if(users[u].pass!==p) return alert('Password salah'); }
 curUser=u; localStorage.setItem('ai_cur_user',curUser);
 localStorage.setItem('ai_users',JSON.stringify(users));
 checkLogin();
}
function logout(){
 if(!confirm('Keluar dari akun '+curUser+'?')) return;
 curUser=null; localStorage.removeItem('ai_cur_user'); $('chatBox').innerHTML=''; $('list').innerHTML=''; openM('loginM');
}
function saveData(){ if(!curUser) return; localStorage.setItem('ai_users',JSON.stringify(users)); localStorage.setItem('gemini_keys',JSON.stringify(keys)); }
function getCurData(){ return users[curUser]; }

// === CHAT PER AKUN ===
function newChat(){
 if(!checkLogin()) return;
 let id=Date.now().toString(); users[curUser].chats[id]=[]; users[curUser].curId=id; saveData(); renderList(); load();
}
function renderList(){
 if(!curUser) return; const list=$('list'); list.innerHTML=''; const chats=users[curUser].chats;
 Object.keys(chats).reverse().forEach(id=>{
  const d=document.createElement('div'); d.className='chatItem'+(id==users[curUser].curId?' active':'');
  d.textContent=(chats[id][0]?.text||'New Chat').slice(0,28);
document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(m=>m.classList.remove('on')));
$('btnLogin').onclick=()=>$('loginModal').classList.add('on');
$('doLogin').onclick=()=>{
  const e=$('loginEmail').value.trim(); if(!e.includes('@')) return alert('Email salah');
  user={email:e,name:$('loginName').value.trim()||e.split('@')[0]};
  localStorage.setItem('user_login',JSON.stringify(user));
  $('loginModal').classList.remove('on'); refreshUser();
};
$('btnLogout').onclick=()=>{
  if(confirm('Keluar? Riwayat tetap kesimpan untuk email ini.')){
    localStorage.removeItem('user_login'); user=null; cur=Date.now().toString(); refreshUser();
  }
};
                                      </script>
