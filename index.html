<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload File</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#212121;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:16px}
.box{width:100%;max-width:420px;background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
h2{text-align:center}
.upload-area{border:2px dashed #555;border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;transition:.2s}
.upload-area:hover{background:#2a2a2a;border-color:#888}
.upload-area.dragover{background:#2f2f2f;border-color:#fff}
#fileInp{display:none}
#preview{display:none;background:#2f2f2f;border-radius:12px;padding:12px;font-size:14px}
#preview img{max-width:100%;border-radius:10px;margin-bottom:8px;display:block}
.info{font-size:12px;opacity:.6;text-align:center}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:16px;cursor:pointer}
.btn-upload{background:#fff;color:#000}
.btn-clear{background:transparent;color:#ff6b6b;border:1px solid #444;margin-top:8px}
</style>
</head>
<body>

<div class="box">
  <h2>📎 Upload File</h2>

  <label class="upload-area" id="dropArea">
    <div style="font-size:40px">📁</div>
    <div style="margin-top:8px;font-weight:600">Klik atau drag file kesini</div>
    <div style="font-size:12px;opacity:.6;margin-top:4px">Gambar, PDF, DOCX, TXT (max 10MB)</div>
    <input type="file" id="fileInp" accept="image/*,application/pdf,.doc,.docx,.txt,.zip">
  </label>

  <div id="preview"></div>

  <button class="btn btn-upload" onclick="doUpload()">Upload Sekarang</button>
  <button class="btn btn-clear" onclick="clearF()" style="display:none" id="btnClear">✕ Hapus File</button>

  <div class="info">File disimpan di browser (base64) & bisa dikirim ke AI</div>
</div>

<script>
let pend = null;
const fileInp = document.getElementById('fileInp');
const dropArea = document.getElementById('dropArea');
const preview = document.getElementById('preview');
const btnClear = document.getElementById('btnClear');

// klik area
dropArea.addEventListener('click', () => fileInp.click());

// drag & drop
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', e => {
  e.preventDefault(); dropArea.classList.remove('dragover');
  if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

fileInp.onchange = e => {
  if(e.target.files[0]) handleFile(e.target.files[0]);
};

function handleFile(f){
  if(f.size > 10*1024*1024) return alert('File kegedean, max 10MB');
  let r = new FileReader();
  r.onload = ev => {
    pend = { name:f.name, mime:f.type, data:ev.target.result, size:f.size };
    preview.style.display = 'block';
    btnClear.style.display = 'block';
    if(f.type.startsWith('image/')){
      preview.innerHTML = `<img src="${ev.target.result}"><b>📎 ${f.name}</b><br><small>${(f.size/1024).toFixed(1)} KB - ${f.type}</small>`;
    } else {
      preview.innerHTML = `<div style="font-size:30px">📄</div><b>${f.name}</b><br><small>${(f.size/1024).toFixed(1)} KB - ${f.type||'file'}</small>`;
    }
  };
  r.readAsDataURL(f);
}

function clearF(){
  pend = null;
  preview.style.display = 'none';
  preview.innerHTML = '';
  btnClear.style.display = 'none';
  fileInp.value = '';
}

function doUpload(){
  if(!pend) return alert('Pilih file dulu!');
  // SIMPAN KE LOCALSTORAGE BIAR BISA DIPAKE DI CHAT
  localStorage.setItem('last_upload', JSON.stringify(pend));
  alert('✅ File siap! Nama: ' + pend.name + '\nSekarang file ini kesimpan dan bisa kamu kirim ke AI di halaman chat.');
  // kalau mau langsung balik ke index.html
  // location.href = 'index.html';
}
</script>
</body>
</html>
