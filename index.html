<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat Akun</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#212121;color:#fff;display:flex;height:100dvh}
#sidebar{width:260px;background:#171717;border-right:1px solid #333;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
#chatBox{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:80%;padding:10px 14px;border-radius:16px}.user{align-self:flex-end;background:#444}.ai{align-self:flex-start;background:#2f2f2f}
.bubble img{max-width:200px;border-radius:8px;display:block;margin-bottom:5px}
#inputWrap{margin:10px auto;width:95%;max-width:800px;background:#2f2f2f;border-radius:24px;display:flex;align-items:center;padding:5px 12px}
#msgInp{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:10px}
#loginPage{position:fixed;inset:0;background:#121212;z-index:999;display:flex;align-items:center;justify-content:center}
.card{width:90%;max-width:340px;background:#1e1e1e;padding:24px;border-radius:16px;display:flex;flex-direction:column;gap:14px;border:1px solid #333}
.card input{padding:14px;border-radius:10px;border:1px solid #444;background:#2a2a2a;color:#fff;font-size:16px}
.card button{padding:14px;border-radius:10px;border:none;background:#fff;color:#000;font-weight:bold;font-size:16px;cursor:pointer}
.chatItem{padding:9px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatItem:hover{background:#2f2f2f}
#userBox{padding:12px;border-top:1px solid #333;background:#1e1e1e}
</style>
</head><body>

<div id="sidebar">
<div style="padding:12px"><button onclick="newChat()" style="width:100%;padding:10px;border-radius:10px;background:#2f2f2f;color:#fff;border:1px solid #444">+ Chat Baru</button></div>
<div id="list" style="flex:1;overflow:auto;padding:8px"></div>
<div id="userBox">
<div id="uName" style="font-size:14px;margin-bottom:8px">👤 Guest</div>
<button onclick="logout()" style="width:100%;padding:8px;border-radius:8px;background:transparent;color:#ff6b6b;border:1px solid #444;cursor:pointer">🚪 Logout</button>
</div>
</div>

<div id="main">
<div style="padding:12px;border-bottom:1px solid #333;display:flex;justify-content:space-between"><span>AI Chat</span><button onclick="openApi()" style="background:none;border:none;color:#fff">⚙️</button></div>
<div id="chatBox"></div>
<div style="padding:10px"><div id="inputWrap"><input id="msgInp" placeholder="Ketik pesan..."><button onclick="send()" style="background:#fff;color:#000;border:none;width:32px;height:32px;border-radius:50%">↑</button></div></div>
</div>

<!-- HALAMAN LOGIN FULL, JADI TOMBOL PASTI BISA DIPENCET -->
<div id="loginPage">
<div class="card">
<h2 style="text-align:center">Masuk Akun</h2>
<input id="uInp" placeholder="Username (misal: budi)">
<input id="pInp" type="password" placeholder="Password">
<button id="btnLogin">MASUK / DAFTAR</button>
<p style="font-size:11px;opacity:.5;text-align:center">Username baru = otomatis daftar. Chat tersimpan di akun ini saja.</p>
</div>
</div>

<div id="apiM" style="display:none;position:fixed;inset:0;background:#000a;z-index:1000;align-items:center;justify-content:center"><div class="card"><h3>API Key</h3><input id="kInp" placeholder="Paste Gemini Key"><button onclick="saveKey()">Simpan</button><button onclick="this.parentElement.parentElement.style.display='none'" style="background:transparent;color:#fff;border:1px solid #444">Tutup</button></div></div>

<script>
let users = JSON.parse(localStorage.getItem('ai_users')||'{}');
let curUser = localStorage.getItem('ai_cur_user');
let keys = JSON.parse(localStorage.getItem('gemini_keys')||'[]');
let pend=null;
const $=id=>document.getElementById(id);

function init(){
  if(curUser && users[curUser]){ $('loginPage').style.display='none'; $('uName').textContent='👤 '+curUser; render(); load(); }
  else{ $('loginPage').style.display='flex'; }
}
// TOMBOL LOGIN FIX HP
$('btnLogin').addEventListener('click', doLogin);
$('btnLogin').addEventListener('touchend', e=>{e.preventDefault(); doLogin();});
$('uInp').addEventListener('keydown', e=>{if(e.key==='Enter') doLogin()});
$('pInp').addEventListener('keydown', e=>{if(e.key==='Enter') doLogin()});

function doLogin(){
  let u=$('uInp').value.trim(); let p=$('pInp').value.trim();
  if(!u||!p) return alert('Isi username & password dulu');
  if(!users[u]){ users[u]={pass:p, chats:{}, curId:Date.now().toString()}; users[u].chats[users[u].curId]=[]; }
  else{ if(users[u].pass!==p) return alert('Password salah!'); }
  curUser=u; localStorage.setItem('ai_cur_user',curUser); localStorage.setItem('ai_users',JSON.stringify(users));
  $('loginPage').style.display='none'; $('uName').textContent='👤 '+curUser; render(); load();
}
function logout(){
  if(confirm('Yakin mau logout? Chat kamu tetap kesimpan kok.')){ curUser=null; localStorage.removeItem('ai_cur_user'); $('loginPage').style.display='flex'; $('chatBox').innerHTML=''; $('list').innerHTML=''; $('uName').textContent='👤 Guest'; }
}
function newChat(){ if(!curUser) return; let id=Date.now().toString(); users[curUser].chats[id]=[]; users[curUser].curId=id; save(); render(); load(); }
function save(){ localStorage.setItem('ai_users',JSON.stringify(users)); localStorage.setItem('gemini_keys',JSON.stringify(keys)); }
function render(){ if(!curUser) return; const L=$('list'); L.innerHTML=''; Object.keys(users[curUser].chats).reverse().forEach(id=>{let d=document.createElement('div'); d.className='chatItem'; d.textContent=(users[curUser].chats[id][0]?.text||'New Chat').slice(0,25); d.onclick=()=>{users[curUser].curId=id; save(); render(); load();}; L.appendChild(d);}); }
function load(){ if(!curUser) return; const B=$('chatBox'); B.innerHTML=''; let arr=users[curUser].chats[users[curUser].curId]||[]; arr.forEach(m=>{let div=document.createElement('div'); div.className='bubble '+(m.role=='user'?'user':'ai'); let h=''; if(m.image) h+=`<img src="${m.image}">`; h+=(m.text||'').replace(/\n/g,'<br>'); div.innerHTML=h; B.appendChild(div);}); B.scrollTop=B.scrollHeight; }
function openApi(){$('apiM').style.display='flex'} function saveKey(){keys=[$('kInp').value.trim()]; save(); $('apiM').style.display='none'}
async function send(){ let txt=$('msgInp').value.trim(); if(!txt) return; if(!curUser) return; let curId=users[curUser].curId; users[curUser].chats[curId].push({role:'user',text:txt}); $('msgInp').value=''; load(); save(); render();
 try{ let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${keys[0]}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:txt}]}]})}); let j=await res.json(); let rep=j.candidates?.[0]?.content?.parts?.[0]?.text||j.error?.message||'Error'; users[curUser].chats[curId].push({role:'ai',text:rep}); save(); load(); }catch(e){users[curUser].chats[curId].push({role:'ai',text:'Error '+e.message}); save(); load();}}
init();
</script>
</body></html>
