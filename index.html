<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0e0e10;color:#fff;display:flex;height:100vh;height:100dvh;overflow:hidden}
#sidebar{width:280px;background:#171717;display:flex;flex-direction:column;padding:12px;flex-shrink:0}
#chatList{flex:1;overflow-y:auto;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.item{padding:10px 12px;border-radius:10px;background:#212121;display:flex;justify-content:space-between;align-items:center;position:relative;cursor:pointer}
.item.active{background:#2f2f2f;border:1px solid #3a3a3a}
.dot{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer;padding:4px 8px}
.menu{display:none;position:absolute;right:8px;top:40px;background:#2a2a2a;border-radius:10px;z-index:50;min-width:130px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.menu.on{display:block}.menu button{width:100%;padding:10px;background:none;border:none;color:#fff;text-align:left;cursor:pointer}
.menu button:hover{background:#3a3a3a}
.sideBottom{display:flex;flex-direction:column;gap:8px;border-top:1px solid #2a2a2a;padding-top:10px;flex-shrink:0}
.sideBottom button{padding:10px;border-radius:10px;border:none;font-weight:600;cursor:pointer}
#btnNew{background:#fff;color:#000}#btnLogin,#btnApi{background:#2f2f2f;color:#fff}#btnLogout{background:#ff4d4d;color:#fff}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{padding:12px 16px;background:#171717;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a2a}
#chatBox{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;line-height:1.5;word-break:break-word}
.msg.user{align-self:flex-end;background:#2f2f2f}.msg.ai{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a}
.msg img{max-width:100%;border-radius:8px;margin-top:6px}
#inpBar{padding:10px;background:#171717;display:flex;gap:6px;align-items:center;border-top:1px solid #2a2a2a;flex-shrink:0}
#inpBar input[type=text]{flex:1;padding:12px 16px;border-radius:24px;border:none;background:#2f2f2f;color:#fff;outline:none}
.iconBtn{width:38px;height:38px;border-radius:50%;border:none;background:#2f2f2f;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
#btnSend{padding:10px 18px;border-radius:24px;border:none;background:#fff;color:#000;font-weight:700;cursor:pointer}
#previewBar{display:none;padding:8px 12px;background:#1a1a1a;gap:8px;align-items:center;border-top:1px solid #2a2a2a}
#previewBar img{width:40px;height:40px;border-radius:6px;object-fit:cover}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal.on{display:flex}.box{background:#212121;padding:20px;border-radius:16px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow-y:auto}
.box input,.box select{padding:11px;border-radius:10px;border:none;background:#2f2f2f;color:#fff;width:100%}
.box label{font-size:12px;color:#aaa}
</style>
</head>
<body>

<div id="sidebar">
  <div style="padding:8px 4px"><b>AI Chat</b></div>
  <div id="userBox" style="display:none;margin:8px 0;padding:10px;background:#2a2a2a;border-radius:10px;font-size:13px"><span id="uEmail"></span></div>
  <div id="chatList"></div>
  <div class="sideBottom">
    <button id="btnNew">+ Chat Baru</button>
    <div style="display:flex;gap:8px"><button id="btnLogin" style="flex:1">Login</button><button id="btnLogout" style="flex:1;display:none">Logout</button><button id="btnApi">⚙️</button></div>
  </div>
</div>

<div id="main">
  <div id="top"><b id="title">Chat Baru</b><span id="status" style="font-size:11px;color:#aaa">Belum login</span></div>
  <div id="chatBox"></div>
  <div id="previewBar"><img id="prevImg"><span id="prevName" style="flex:1;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></span><button onclick="clearFile()" style="background:#ff4d4d;border:none;color:#fff;border-radius:50%;width:24px;height:24px">✕</button></div>
  <div id="inpBar">
    <button class="iconBtn" id="btnFile" title="Upload File">📎</button>
    <button class="iconBtn" id="btnMedia" title="Upload Gambar">🖼️</button>
    <input type="file" id="fileInput" style="display:none">
    <input type="file" id="mediaInput" accept="image/*,video/*,audio/*" style="display:none">
    <input type="text" id="msgInp" placeholder="Ketik pesan...">
    <button id="btnSend">Kirim</button>
  </div>
</div>

<div id="loginModal" class="modal"><div class="box">
  <h3>Login Privat</h3><input id="loginName" placeholder="Nama"><input id="loginEmail" placeholder="Email">
