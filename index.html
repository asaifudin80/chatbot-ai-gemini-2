<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIX INPUT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{height:100dvh;display:flex;flex-direction:column;background:#0f0f0f}
#top{padding:12px;background:#202020;color:#fff;display:flex;gap:10px;align-items:center;border-bottom:1px solid #333}
#top button{width:36px;height:36px;border-radius:50%;border:1px solid #444;background:#2a2a2a;color:#fff}
#chatBox{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px}
.msg.user{align-self:flex-end;background:#3b82f6;color:#fff}
.msg.bot{align-self:flex-start;background:#2a2a2a;color:#fff;border:1px solid #333}
.msg img{max-width:180px;border-radius:8px;margin-top:6px;display:block}

/* INI INPUT YANG KEMARIN HILANG - AKU PAKSA MUNCUL DI BAWAH */
#inputBar{
  display:flex!important;
  gap:8px;
  padding:12px;
  background:#202020;
  border-top:2px solid red; /* biar kelihatan, nanti hapus aja */
  position:sticky;
  bottom:0;
  left:0;
  right:0;
  z-index:99;
}
#userIn{
  flex:1;
  padding:14px 18px;
  border-radius:24px;
  border:1px solid #555;
  background:#111;
  color:#fff;
  outline:none;
  font-size:16px; /* biar gak zoom di iPhone */
}
#sendBtn{width:48px;height:48px;border-radius:50%;border:none;background:#3b82f6;color:#fff;font-size:18px;font-weight:bold}

/* modal api biar gampang */
#apiBox{display:flex;gap:8px;padding:10px;background:#171717;border-bottom:1px solid #333}
#apiBox input{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#2a2a2a;color:#fff}
</style>
</head>
<body>

<div id="top">
  <button onclick="location.reload()">☰</button>
  <b>As AI - Input Fix</b>
  <button id="clearBtn" style="margin-left:auto">🗑️</button>
</div>

<div id="apiBox">
  <input type="password" id="apiKey" placeholder="Paste API Key Gemini (AIza...)">
  <button id="saveKey" style="padding:10px 14px;border-radius:8px;border:none;background:#3b82f6;color:#fff;font-weight:bold">Simpan</button>
</div>

<div id="chatBox"></div>

<!-- INPUT BAR - INI YANG TADI HILANG -->
<form id="inputBar">
  <input type="text" id="userIn" placeholder="Ketik pesan disini... (pasti muncul sekarang)" autocomplete="off" required>
  <button type="submit" id="sendBtn">➤</button>
</form>

<script>
const chatBox=document.getElementById('chatBox');
const userIn=document.getElementById('userIn');
const apiKeyInput=document.getElementById('apiKey');
apiKeyInput.value=localStorage.getItem('gemini_key')||'';
let chats=JSON.parse(localStorage.getItem('chats')||'[]');
chats.forEach(m=>add(m.t,m.s,false));
function save(){localStorage.setItem('chats',JSON.stringify(chats));}
function add(t,s,sv=true){
  const d=document.createElement('div');d.className='msg '+s;d.textContent=t;chatBox.appendChild(d);chatBox.scrollTop=99999;
  if(sv){chats.push({t,s}); save();} return d;
}
document.getElementById('saveKey').onclick=()=>{
  const k=apiKeyInput.value.trim(); if(!k) return alert('Isi API Key dulu');
  localStorage.setItem('gemini_key',k); alert('Key disimpan!');
};
document.getElementById('clearBtn').onclick=()=>{if(confirm('Hapus chat?')){chats=[];localStorage.removeItem('chats');chatBox.innerHTML='';}};
document.getElementById('inputBar').addEventListener('submit', async e=>{
  e.preventDefault();
  const key=localStorage.getItem('gemini_key'); if(!key) return alert('Isi API Key di atas dulu!');
  const txt=userIn.value.trim(); if(!txt) return;
  add(txt,'user',true); userIn.value='';
  const load=add('...','bot',false);
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:txt}]}]})
    });
    const data=await res.json(); load.remove();
    if(data.candidates) add(data.candidates[0].content.parts[0].text,'bot',true);
    else add('Error: '+JSON.stringify(data).slice(0,200),'bot',true);
  }catch(err){ load.remove(); add('Error koneksi','bot',true); }
});
</script>
</body>
</html>
